[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tabvio_web*"]

[tool.setuptools.package-data]
"tabvio_web.server" = ["static/*"]

[project]
name = "tabvio-web"
version = "0.1.0"
requires-python = ">=3.11,<3.15"

dependencies = [
    "python-dotenv",
    "markdown",
    "nh3",
    "fastapi>=0.116.0,<1.0",
    "uvicorn[standard]>=0.35.0,<1.0",
    "workos>=5.10",
    "cryptography>=43.0",
    "pydantic>=2.0,<3.0",
    "starlette>=0.40.0,<1.0",
    "tabvio-agent",
    "sqlalchemy>=2.0,<3.0",
]

[tool.uv.sources]
tabvio-agent = { git = "https://github.com/JimGalvan/Tabvio.git", subdirectory = "packages/tabvio-agent", rev = "a2ed8b33a33b1b6add8da0657bf8efc35ee1f837" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["T201", "E501", "UP006", "UP007", "E402"]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.15.17",
]
